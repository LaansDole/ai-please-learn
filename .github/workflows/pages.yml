name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build for the /ai-please-learn/ sub-path
        run: npm run build
        env:
          EVOLAB_BASE: /ai-please-learn/
          EVOLAB_STATIC: '1'
      - name: Gate on the built app
        run: |
          touch dist/.nojekyll
          grep -q "<title>EvoLab" dist/index.html
          ls dist/assets/*.js >/dev/null
          cmp dist/index.html dist/404.html   # deep links (/ai-please-learn/pong/2) boot through 404.html
          test -f dist/demo/index.html        # the Demo tab's page (copied by the build: vite.config.ts demoPage)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
