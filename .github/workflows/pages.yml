name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build for the /evolab/ sub-path
        run: npm run build
        env:
          EVOLAB_BASE: /evolab/
          EVOLAB_STATIC: '1'
      - name: Add the demo page if present
        run: |
          if [ -d docs/demo/runbook ]; then
            mkdir -p dist/demo
            cp docs/demo/runbook/demo.html dist/demo/index.html
            cp docs/demo/runbook/*.mp4 docs/demo/runbook/*.png dist/demo/ 2>/dev/null || true
          fi
          touch dist/.nojekyll
      - name: Gate on the built app
        run: |
          grep -q "<title>EvoLab" dist/index.html
          ls dist/assets/*.js >/dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
